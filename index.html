<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snack Chooser</title>
  <link rel="icon" type="image/png" href="IMG_8701.png" />
  <link rel="apple-touch-icon" href="IMG_8701.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://jsdelivr.net"></script>
  <script src="https://google.com" async defer></script>
</head>
<body>

  <header class="gh-header">
    <div class="gh-nav-inner">
      <div class="gh-logo" onclick="location.reload()">
        <img src="IMG_8701.png" alt="Snack Chooser 로고" />
        <span>Snack Chooser</span>
      </div>

      <div id="auth-menu" class="gh-auth-zone">
        <span class="gh-nav-link" onclick="openModal('login')">로그인</span>
        <button class="gh-btn-signup" onclick="openModal('signup')">회원가입</button>
      </div>

      <div id="user-menu" class="gh-auth-zone" style="display: none;">
        <span id="header-user-name" class="gh-nav-link"></span>
        <span class="gh-nav-link" onclick="logout()">로그아웃</span>
      </div>
    </div>
  </header>

  <main class="gh-main-container">
    <section id="user-section" class="gh-card" style="display: none;">
      <h3 id="welcome-msg" class="gh-card-title">My Preferences</h3>
      <p style="font-size: 0.9rem; margin: 0 0 8px;">🚫 나의 알러지 설정</p>
      <div id="allergy-list" class="gh-chips"></div>
    </section>

    <section class="gh-hero-section">
      <button class="gh-btn-main" onclick="pickRandom()">🎲 오늘의 간식 랜덤 뽑기</button>
      <button id="fav-toggle-btn" class="gh-btn-outline" onclick="toggleFavorites()">⭐ 즐겨찾기 목록만 보기</button>
    </section>

    <div id="result" class="gh-result-card">어떤 간식을 먹을까요?</div>

    <nav class="gh-tabs">
      <div class="gh-tab-list">
        <button class="gh-tab-btn active" onclick="setCategory('all', event)">전체</button>
        <button class="gh-tab-btn" onclick="setCategory('snack', event)">과자</button>
        <button class="gh-tab-btn" onclick="setCategory('icecream', event)">아이스크림</button>
        <button class="gh-tab-btn" onclick="setCategory('tradition', event)">전통</button>
        <button class="gh-tab-btn" onclick="setCategory('candy', event)">사탕&젤리</button>
        <button class="gh-tab-btn" onclick="setCategory('drink', event)">음료</button>
      </div>
    </nav>

    <ul id="snack-list" class="gh-snack-list"></ul>
  </main>

  <!-- 로그인 / 회원가입 모달 -->
  <div id="auth-modal" class="gh-modal">
    <div class="gh-modal-box">
      <div class="gh-modal-head">
        <h2 id="modal-title">로그인</h2>
        <button class="gh-modal-close" onclick="closeModal()">×</button>
      </div>

      <div id="login-form">
        <input type="text" id="login-name" class="gh-input" placeholder="이름" />
        <input type="password" id="login-pw" class="gh-input" placeholder="비밀번호" />
        <div class="captcha-wrap">
          <div id="recaptcha-login"></div>
        </div>
        <button class="gh-btn-submit" onclick="handleLogin()">로그인</button>
      </div>

      <div id="signup-form" style="display: none;">
        <input type="text" id="signup-name" class="gh-input" placeholder="이름" />
        <input type="password" id="signup-pw" class="gh-input" placeholder="비밀번호" />
        <p style="font-size: 0.85rem; margin: 8px 0 4px;">🚫 알러지 선택</p>
        <div id="signup-allergy-list" class="gh-chips" style="max-height: 120px; overflow-y: auto; margin-bottom: 8px;"></div>
        <div class="captcha-wrap">
          <div id="recaptcha-signup"></div>
        </div>
        <button class="gh-btn-submit" onclick="handleSignup()">가입 완료</button>
      </div>
    </div>
  </div>

  <!-- 간식 상세 모달 -->
  <div id="snack-detail-modal" class="gh-modal">
    <div class="gh-modal-box">
      <div class="gh-modal-head">
        <h2 id="detail-snack-name">간식 이름</h2>
        <button class="gh-modal-close" onclick="closeSnackModal()">×</button>
      </div>
      <div id="detail-snack-allergies" class="snack-detail-info"></div>
    </div>
  </div>

  <script src="snackname.js"></script>
  <script src="script.js"></script>
</body>
</html>
