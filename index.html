<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍪 Snack Chooser</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍪</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="gh-header">
    <div class="gh-nav-inner">
      <div class="gh-logo" onclick="location.reload()">
        <span style="font-size:24px;" aria-label="쿠키">🍪</span>
        <span>Snack Chooser</span>
      </div>

      <div id="auth-menu" class="gh-auth-zone">
        <span class="gh-nav-link" onclick="openModal('login')">로그인</span>
        <button class="gh-btn-signup" onclick="openModal('signup')">회원가입</button>
      </div>

      <div id="user-menu" class="gh-auth-zone" style="display: none;">
        <span id="header-user-name" class="gh-user-name"></span>
        <span class="gh-nav-link logout" onclick="logout()">로그아웃</span>
      </div>
    </div>
  </header>

  <main class="gh-main-container">
    <section id="user-section" class="gh-card" style="display:none;">
      <h3 class="gh-card-title">My Preferences</h3>
      <p id="welcome-msg" class="gh-welcome-txt"></p>
      <div class="gh-allergy-group">
        <label class="gh-label">🚫 나의 알러지 설정</label>
        <div id="allergy-list" class="gh-chips"></div>
      </div>
    </section>

    <div class="gh-hero-section">
      <button onclick="pickRandom()" class="gh-btn-main">🎲 오늘의 간식 랜덤 뽑기</button>
      <button onclick="toggleFavorites()" id="fav-toggle-btn" class="gh-btn-outline">⭐ 즐겨찾기 목록만 보기</button>
    </div>

    <nav class="gh-tabs">
      <div class="gh-tab-list">
        <button onclick="setCategory('all', event)" class="gh-tab-btn active">전체</button>
        <button onclick="setCategory('snack', event)" class="gh-tab-btn">과자</button>
        <button onclick="setCategory('icecream', event)" class="gh-tab-btn">아이스크림</button>
        <button onclick="setCategory('tradition', event)" class="gh-tab-btn">전통</button>
        <button onclick="setCategory('candy', event)" class="gh-tab-btn">사탕&amp;젤리</button>
        <button onclick="setCategory('drink', event)" class="gh-tab-btn">음료</button>
      </div>
    </nav>

    <div id="result" class="gh-result-card">어떤 간식을 먹을까요?</div>
    <ul id="snack-list" class="gh-snack-list"></ul>
  </main>

  <div id="auth-modal" class="gh-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="gh-modal-box">
      <div class="gh-modal-head">
        <h2 id="modal-title">로그인</h2>
        <button class="gh-modal-close" type="button" onclick="closeModal()" aria-label="닫기">&times;</button>
      </div>
      <div id="login-form">
        <input type="text" id="login-name" class="gh-input" placeholder="아이디" autocomplete="username">
        <input type="password" id="login-pw" class="gh-input" placeholder="비밀번호" autocomplete="current-password">
        <button class="gh-btn-submit" type="button" onclick="handleLogin()">로그인</button>
      </div>
      <div id="signup-form" style="display:none;">
        <input type="text" id="signup-name" class="gh-input" placeholder="아이디" autocomplete="username">
        <input type="password" id="signup-pw" class="gh-input" placeholder="비밀번호" autocomplete="new-password">
        <div class="gh-signup-allergy-label">알레르기를 선택하세요</div>
        <div id="signup-allergy-list" class="gh-chips" style="margin: 10px 0;"></div>
        <button class="gh-btn-submit" type="button" onclick="handleSignup()">가입 완료</button>
      </div>
    </div>
  </div>

  <div id="snack-detail-modal" class="gh-modal" role="dialog" aria-modal="true">
    <div class="gh-modal-box">
      <div class="gh-modal-head">
        <h2 id="detail-snack-name">이름</h2>
        <button class="gh-modal-close" type="button" onclick="closeSnackModal()" aria-label="닫기">&times;</button>
      </div>
      <div class="snack-detail-info">
        <p id="snack-detail-allergies" style="margin: 10px 0; font-size: 14px;"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
